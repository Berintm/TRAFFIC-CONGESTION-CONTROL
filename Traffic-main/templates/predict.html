<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Traffic Input | AI Traffic System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            color:white;
        }

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 40px;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(12px);
        }

        .nav-btn{
            padding:8px 18px;
            border-radius:20px;
            background:#4facfe;
            color:white;
            text-decoration:none;
        }

        .container{
            text-align:center;
            padding:40px;
        }

        h1{
            margin-bottom:10px;
        }

        .subtitle{
            opacity:0.8;
            margin-bottom:40px;
        }

        form{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
        }

        .junction-card{
            width:300px;
            margin:20px;
            padding:25px;
            border-radius:20px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            box-shadow:0 10px 25px rgba(0,0,0,0.4);
            transition:0.4s;
        }

        .junction-card:hover{
            transform:translateY(-8px);
            background:rgba(255,255,255,0.12);
        }

        .junction-card h3{
            margin-bottom:15px;
            color:#4facfe;
        }

        input{
            width:100%;
            padding:8px;
            margin-bottom:10px;
            border-radius:10px;
            border:none;
            outline:none;
            text-align:center;
            font-weight:500;
        }

        .total-box{
            background:rgba(255,255,255,0.15);
            padding:6px;
            border-radius:8px;
            margin-top:5px;
            font-size:14px;
        }

        .meter{
            height:10px;
            border-radius:10px;
            margin-top:8px;
            background:#333;
            overflow:hidden;
        }

        .meter-fill{
            height:100%;
            width:0%;
            background:lime;
            transition:0.4s;
        }

        .submit-btn{
            margin-top:30px;
            padding:14px 40px;
            border-radius:30px;
            border:none;
            background:linear-gradient(90deg,#00c6ff,#0072ff);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .submit-btn:hover{
            transform:scale(1.05);
        }

        @media(max-width:768px){
            .junction-card{width:90%;}
        }

    </style>
</head>

<body>

<div class="navbar">
    <h2>🚦 Smart Traffic Data Entry</h2>
    <a href="/home" class="nav-btn">Dashboard</a>
</div>

<div class="container">
    <h1>Enter Vehicle Counts for 4 Junctions</h1>
    <div class="subtitle">
        Real-Time Density Preview & Adaptive Timing Prediction
    </div>

    <form method="POST" action="/predict">

        {% for i in range(1,5) %}
        <div class="junction-card">
            <h3>Junction {{i}}</h3>

            <input type="number" name="car{{i}}" placeholder="🚗 Car Count" min="0" required oninput="updateMeter({{i}})">
            <input type="number" name="bike{{i}}" placeholder="🏍 Bike Count" min="0" required oninput="updateMeter({{i}})">
            <input type="number" name="bus{{i}}" placeholder="🚌 Bus Count" min="0" required oninput="updateMeter({{i}})">
            <input type="number" name="truck{{i}}" placeholder="🚛 Truck Count" min="0" required oninput="updateMeter({{i}})">

            <div class="total-box">
                Total Vehicles: <span id="total{{i}}">0</span>
            </div>

            <div class="meter">
                <div class="meter-fill" id="meter{{i}}"></div>
            </div>
        </div>
        {% endfor %}

        <button type="submit" class="submit-btn">
            🚦 Generate Smart Prediction
        </button>

    </form>
</div>

<script>

function updateMeter(index){

    let car = parseInt(document.querySelector(`[name=car${index}]`).value) || 0;
    let bike = parseInt(document.querySelector(`[name=bike${index}]`).value) || 0;
    let bus = parseInt(document.querySelector(`[name=bus${index}]`).value) || 0;
    let truck = parseInt(document.querySelector(`[name=truck${index}]`).value) || 0;

    let total = car + bike + bus + truck;

    document.getElementById("total"+index).innerText = total;

    // Density meter logic
    let percentage = Math.min((total / 200) * 100, 100); 
    let meter = document.getElementById("meter"+index);

    meter.style.width = percentage + "%";

    if(percentage < 40){
        meter.style.background = "lime";
    } else if(percentage < 75){
        meter.style.background = "orange";
    } else {
        meter.style.background = "red";
    }
}

</script>

</body>
</html>
